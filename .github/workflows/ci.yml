name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install from pyproject (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Unit tests
        run: python -m pytest -q

      - name: Pipeline smoke test (dry run of every example)
        run: |
          for cfg in examples/*.yaml; do
            python -m src.experiments.run_from_config --cfg "$cfg" --dry-run
          done
