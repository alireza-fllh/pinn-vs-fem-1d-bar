[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[project]
name = "pinn-vs-fem-1d_elastic_bar"
version = "1.0"
description = "PINN vs FEM on a 1D elastic bar"
requires-python = ">=3.10"
dependencies = [
"numpy",
"scipy",
"matplotlib",
"pyyaml",
"torch",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["src*"]  # ship src as one package, not src-layout


[tool.black]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
